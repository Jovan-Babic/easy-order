# New Android APK, end to end. Run it from GitHub: Actions -> "Release Android"
# -> Run workflow -> enter the version. It:
#   1. sets frontend/app.json "version" (so the APK reports the right version),
#   2. builds the APK on EAS and downloads it,
#   3. publishes it as a GitHub Release (permanent download, unlike EAS links),
#   4. points backend/public/app/app-update.json at it -> Vercel redeploys the
#      backend and every installed app offers the update on its next start.
# Nothing is pushed until the APK has been built and downloaded, so a failed
# run leaves main untouched. Needs the EXPO_TOKEN repository secret.
# Only for native changes - JS/TS-only changes go out via the "OTA update" workflow.
name: Release Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Nova verzija, npr. 1.3.0 (mora biti veća od trenutne u app-update.json)"
        required: true
      release_notes:
        description: "Šta je novo (vide ga korisnici u ponudi za update)"
        required: false
        default: "Nova verzija aplikacije"

permissions:
  contents: write

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.release_notes }}
      GH_TOKEN: ${{ github.token }}
      UPDATE_JSON: backend/public/app/app-update.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check inputs and secret
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing EXPO_TOKEN secret (repo Settings -> Secrets and variables -> Actions)."; exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.3.0, got '$VERSION'"; exit 1
          fi
          CURRENT=$(jq -r '.version // "0.0.0"' "$UPDATE_JSON")
          if [ "$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -n1)" != "$VERSION" ] || [ "$CURRENT" = "$VERSION" ]; then
            echo "::error::Version $VERSION must be greater than the published $CURRENT"; exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists"; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install app dependencies
        working-directory: frontend
        run: npm ci

      - name: Set app version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node -e '
            const fs = require("fs");
            const p = "frontend/app.json";
            const data = JSON.parse(fs.readFileSync(p, "utf8"));
            data.expo.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(data, null, 2) + "\n");
          '
          if ! git diff --quiet frontend/app.json; then
            git commit -m "Android $VERSION: app version" frontend/app.json
          fi

      - name: Build APK on EAS
        working-directory: frontend
        run: |
          eas build --platform android --profile apk --non-interactive --wait --json > "$RUNNER_TEMP/build.json"
          BUILD_URL=$(jq -r '.[0].artifacts.buildUrl // empty' "$RUNNER_TEMP/build.json")
          if [ -z "$BUILD_URL" ]; then
            echo "::error::EAS returned no APK URL"; cat "$RUNNER_TEMP/build.json"; exit 1
          fi
          curl -fL --retry 3 -o "$RUNNER_TEMP/easy-order.apk" "$BUILD_URL"
          SIZE=$(stat -c %s "$RUNNER_TEMP/easy-order.apk")
          echo "Downloaded APK: $SIZE bytes"
          [ "$SIZE" -gt 1000000 ] || { echo "::error::APK looks too small"; exit 1; }

      - name: Push version commit and publish GitHub Release
        run: |
          git pull --rebase origin main
          git push origin HEAD:main
          gh release create "v$VERSION" "$RUNNER_TEMP/easy-order.apk" \
            --target "$(git rev-parse HEAD)" \
            --title "Easy Order $VERSION" \
            --notes "$NOTES" \
            --latest

      - name: Point app-update.json at the new release
        run: |
          # Versioned URL: the file behind it can never differ from "version".
          # (https://github.com/<repo>/releases/latest/download/easy-order.apk is
          # a stable link to share by hand; it always resolves to the newest.)
          export DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/easy-order.apk"
          export BUILD_DATE=$(date -u +%d.%m.%Y)
          node -e '
            const fs = require("fs");
            const p = process.env.UPDATE_JSON;
            const data = {
              enabled: true,
              version: process.env.VERSION,
              download_url: process.env.DOWNLOAD_URL,
              build_date: process.env.BUILD_DATE,
              release_notes: process.env.NOTES,
            };
            fs.writeFileSync(p, JSON.stringify(data, null, 2) + "\n");
          '
          # APKs no longer live in the repo (removes the last one committed by hand).
          git rm -q --ignore-unmatch backend/public/app/*.apk
          git add "$UPDATE_JSON"
          git commit -m "Android $VERSION: publish update"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Summary
        run: |
          {
            echo "### Easy Order $VERSION"
            echo "- Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}"
            echo "- Stable download link: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/easy-order.apk"
            echo "- app-update.json updated; Vercel redeploys the backend from this push."
          } >> "$GITHUB_STEP_SUMMARY"
