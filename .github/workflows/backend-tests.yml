# Runs the backend integration tests on every push / pull request against a
# throwaway MongoDB. It only reports pass/fail on the commit - Vercel deploys
# independently and is not blocked by this workflow.
name: Backend tests

on:
  push:
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: easy_order_ci
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      SUPERADMIN_PASSWORD: ChangeMe123!
      SEED_DEMO_DATA: "true"
      PASSWORD_RESET_DEBUG_TOKEN_IN_RESPONSE: "true"
      # No SMTP_* vars: invites then return the temporary password in the
      # response, which the tests rely on (and no real email is ever sent).
      EXPO_PUBLIC_BACKEND_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Start API
        run: |
          python -m uvicorn server:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/ && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/api/ || (cat server.log; exit 1)
      - run: pytest tests -v
      - name: Server log
        if: failure()
        run: cat server.log
